# This workflow will do a clean install of node dependencies, build the source
# code and run tests in block on the latest version of node.

name: test

on:
  pull_request:
    types: [closed]
    branches:
      - develop

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Compile SRE with locales
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Setup Speech Rule Engine
        run: |
          pnpm -r i
          pnpm build
          cd testsuite
          pnpm compile

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sre-library
          path: |
                lib
                js
                package.json
                testsuite/js
                testsuite/tests

  test:
    needs: setup
    runs-on: ubuntu-latest
    name: SRE jests tests for all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Downloading the build
        uses: actions/download-artifact@v4
        with:
          name: sre-library

      - name: Set up tests
        run: |
          pnpm -r i --ignore-scripts

      - name: Run tests for all
        run: pnpm test:action tests/actions/ --coverageReporters=json

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: speech-rule-engine/speech-rule-engine
          file: coverage/coverage-final.json
          name: codecov-$(date +%Y%m%d)
